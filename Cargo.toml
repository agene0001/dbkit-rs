[package]
name = "dbkit-rs"
version = "0.3.1"
edition = "2024"
license = "MIT" 
description = "Multi-backend database infrastructure: sqlx writes (Postgres/MySQL/SQLite) with optional DuckDB/DataFusion analytical reads, pooling, caching, and migrations"
readme = "README.md"
repository = "https://github.com/agene0001/dbkit-rs"
homepage = "https://github.com/agene0001/dbkit-rs"
documentation = "https://docs.rs/dbkit-rs"
keywords = ["database", "sqlx", "duckdb", "datafusion", "arrow"]
categories = ["database"]
exclude = [".claude/"]

[lib]
name = "dbkit"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
# Native Postgres pool with full type support (uuid, chrono, json) for rich
# types the multi-backend `Any` pool can't represent.
postgres-native = ["postgres", "sqlx/uuid", "sqlx/chrono", "sqlx/json"]
# Analytical read engines (embedded). Both are on arrow 58, so they share a
# unified arrow crate and may be enabled together.
duckdb = ["dep:duckdb", "dep:async-trait", "_read-typed"]
datafusion = ["dep:datafusion", "dep:async-trait", "_read-typed"]
# Remote analytical sources (query-only, no sync).
clickhouse = ["dep:reqwest", "dep:async-trait", "_read-typed", "arrow/ipc"]
# Internal: the direct arrow crate (single source of `RecordBatch`), and the
# typed-read helper shared by embedded engines and remote sources.
_arrow = ["dep:arrow"]
_read-typed = ["dep:serde", "dep:serde_arrow", "serde_arrow/arrow-58", "_arrow"]

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "migrate"] }
duckdb = { version = "1.10504", features = ["bundled", "vtab-arrow"], optional = true }
dashmap = "6.2.1"
tokio = { version = "1.52.3", features = ["rt"] }
tracing = "0.1"
thiserror = "2"
unicode-normalization = "0.1"
datafusion = { version = "54.0.0", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1", optional = true }
serde_arrow = { version = "0.14", optional = true }
# Single direct arrow dependency — unifies with the engines' arrow (all on 58).
arrow = { version = "58", optional = true }
# HTTP client for remote sources (ClickHouse), rustls to avoid native-tls.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "query"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
